# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# A new entry; not a revision of any registered entry.
version: "v0.4"

project:
  name: "Reversible units of a degree-nine field: in K = LM (L totally real cubic, M cubic with one real place) the units with rank-one Hermitian symbol are exactly the units of trivial relative norm to L and M, a group of rank two, and exactly those whose Schur multipliers run both ways"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of ten statements. Let K
    be a number field of degree 9 containing a totally real cubic field L
    and a cubic field M with one real place. Then K = LM has signature
    (3, 3), and its nine embeddings are the pairs (lambda, mu). A slot
    assignment, fixed by a labelling of L's embeddings and a non-real
    embedding mu_1 of M, places the nine conjugates of x in K in a 3 x 3
    Hermitian array, the symbol of x; the symbol of x^-1 is its entrywise
    (Hadamard) inverse. (1) For every finite index type, a positive
    semidefinite complex matrix with no zero entry has positive
    semidefinite Hadamard inverse iff it is w w* (rank one); (2) for every
    complex matrix with no zero entry (positive semidefiniteness not
    assumed), the Schur multipliers of the matrix and of its Hadamard
    inverse are both completely positive iff it is w w*. Statements 1-2
    are supporting lemmas. (3) The setting: L and M are
    linearly disjoint, L M = K, and K has 3 real and 3 complex places.
    (4) The slot assignment exists, is a bijection Fin 3 x Fin 3 ~ (K ->
    C) with real diagonal and conjugate-symmetric slots, and is unique.
    (5) For x != 0 in K, the symbol of x is rank one iff N_{K/L}(x) and
    N_{K/M}(x) are one and the same positive rational number. (6) For a
    unit u, the symbol is rank one iff N_{K/L}(u) = N_{K/M}(u) = 1. (7)
    These units H are torsion-free and their logarithmic embedding spans
    a Z-module of rank 2, so H is isomorphic to Z^2 (the isomorphism is not
    itself a Lean term). (8) For a unit u, the
    Schur multipliers of the symbols of u and of u^-1 are both completely
    positive iff u is in H. (9) There is a unit of infinite order all of
    whose powers run both ways. (10) The degree-four contrast: in a field
    with two real places and one complex place, both Schur multipliers of
    the 2 x 2 place symbol of a unit u and of u^-1 are completely positive
    iff u is positive at both real places and |sigma(u)| = 1. Statements
    4-6, 8 and 9 hold for every labelling and every non-real mu_1. The compositum
    place bookkeeping is ported, with citation, from the registered entry
    PALOMAR-2026-10-21-000012; it is not re-proved. Application, cited
    and not a claim of the entry: if a unit acts by multiplication on a
    Hermitian register of its places and an admissible step must be
    completely positive, then in degree four a step u != 1 runs both ways
    only through a conjugate on the unit circle (Salem type); in a field
    such as Q(Q), Q^4 = Q + 1, the only such elements are +-1 (not proved
    in this entry; it follows from statement 17 of the registered entry
    PALOMAR-2026-10-21-000012, since Q(Q) is contained in Q(rho, Q)). In
    degree nine a rank-two group of units runs both ways. The steps are
    completely positive, not trace-non-increasing.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.NT / 11R27, 11R16, 11R06: units of number fields, cubic fields,
  # Salem-type conjugates (statements 3-10). math.OA and math.RA / 15B48:
  # positive semidefinite matrices, Hadamard inverses and Schur
  # multipliers (statements 1-2, 8-10). quant-ph and math-ph / 81P47:
  # complete positivity is the positivity condition on quantum operations
  # (which are in addition trace-non-increasing; the maps here are CP but
  # not trace-normalized), and the README's application section states the
  # physical reading as a cited application.
  arxiv: ["math.NT", "math.OA", "math.RA", "quant-ph", "math-ph"]
  msc2020: ["11R27", "11R16", "11R06", "15B48", "47B49", "81P47"]

sources:
  - title: "Completely Bounded Maps and Operator Algebras"
    authors:
      - "Vern Paulsen"
    id: "Cambridge Studies in Advanced Mathematics 78, Cambridge University Press (2002)"
    # DOI of the online edition 10.1017/CBO9780511546631 (2003); Thm 3.7 locator confirmed by citing
    # papers (Arhancet arXiv:1910.14434); chapter not opened.
    type: "book"
    location: "https://doi.org/10.1017/CBO9780511546631"
    relationship: "builds-on"
    note: >-
      Theorem 3.7: the Schur multiplier X -> S ⊙ X is completely positive
      iff S is positive semidefinite. Proved in the entry's library
      (ReversibleUnits.isCPSchur_iff_posSemidef) and used in statements 2,
      8, 9 and 10. Classical; no novelty claimed for it.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Hadamard inverses, square roots and products of almost semidefinite matrices"
    authors:
      - "Robert Reams"
    id: "Linear Algebra and its Applications 288 (1999), 35-43"
    # Crossref-verified 2026-11-02: DOI 10.1016/S0024-3795(98)10162-3. Content not read.
    type: "article"
    location: "https://doi.org/10.1016/S0024-3795(98)10162-3"
    relationship: "background"
    note: >-
      Adjacent literature on Hadamard inverses of semidefinite matrices.
      Statement 1 (a PSD matrix with no zero entry has PSD Hadamard
      inverse iff it has rank one): Reams 1999 was identified by title
      only (content not read) and may contain it; no novelty is claimed
      for it.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Hadamard Semigroups of Off-Diagonal Constant Matrices"
    authors:
      - "Y. Lim"
    id: "Journal of Lie Theory 30 (2020), no. 2, 473-488"
    # Crossref-verified 2026-11-02: DOI 10.5802/jolt.1126. Journal page abstract only.
    type: "article"
    location: "https://doi.org/10.5802/jolt.1126"
    relationship: "background"
    note: >-
      Treats the group of units of the Hadamard semigroup of positive
      semidefinite matrices for off-diagonal-constant matrices; adjacent to
      statement 1.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The arithmetic and geometry of Salem numbers"
    authors:
      - "Eknath Ghate"
      - "Eriko Hironaka"
    id: "Bulletin of the American Mathematical Society 38 (2001), no. 3, 293-314"
    # Crossref-verified 2026-11-02: DOI 10.1090/S0273-0979-01-00902-8; content: search excerpt only,
    # not read.
    type: "article"
    location: "https://doi.org/10.1090/S0273-0979-01-00902-8"
    relationship: "background"
    note: >-
      Salem numbers and Salem fields. A unit u != 1 of a field of signature
      (2, 1) with a conjugate on the unit circle and positive real
      conjugates is a Salem number or its inverse; statement 10 says the
      units running both ways in degree four are exactly 1 and these.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Seventy years of Salem numbers"
    authors:
      - "Chris Smyth"
    id: "Bulletin of the London Mathematical Society 47 (2015), no. 3, 379-395"
    # Crossref-verified 2026-11-02: DOI 10.1112/blms/bdv027; text read (arXiv:1408.0195v3).
    type: "article"
    location: "https://doi.org/10.1112/blms/bdv027"
    relationship: "background"
    note: "Survey of Salem numbers; background for statement 10."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Additive and multiplicative relations connecting conjugate algebraic numbers"
    authors:
      - "C. J. Smyth"
    id: "Journal of Number Theory 23 (1986), no. 2, 243-254"
    # Crossref-verified 2026-11-02: DOI 10.1016/0022-314X(86)90094-6. Metadata only.
    type: "article"
    location: "https://doi.org/10.1016/0022-314X(86)90094-6"
    relationship: "background"
    note: >-
      Multiplicative relations among conjugates. Rank one of the symbol
      (statement 6) is a system of such relations: the nine conjugates are
      the entries w_i conj(w_j) of w w*.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Nonreciprocal units in a number field with an application to Oeljeklaus-Toma manifolds"
    authors:
      - "Artūras Dubickas"
    id: "New York Journal of Mathematics 20 (2014), 257-274"
    # Journal abstract page checked 2026-11-02 (NYJM 20-16); journal PDF read (Thms 1-2).
    type: "article"
    location: "https://nyjm.albany.edu/j/2014/20-16.html"
    relationship: "background"
    note: >-
      Units of a field of degree s + 2t whose 2t complex conjugates have
      equal modulus: a different conjugate pattern of the same kind
      (complex moduli constrained by the field's structure). Statements 6-7
      concern a different pattern: complex moduli fixed by the real
      conjugates, |u(c_k)|^2 = u(r_i) u(r_j).
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Une caractérisation de certaines classes d'entiers algébriques généralisant les nombres de Salem"
    authors:
      - "Mohamed Kerada"
    id: "Acta Arithmetica 72 (1995), no. 1, 55-65"
    # Crossref-verified 2026-11-02: DOI 10.4064/aa-72-1-55-65; text read 2026-11-01.
    type: "article"
    location: "https://doi.org/10.4064/aa-72-1-55-65"
    relationship: "background"
    note: >-
      Generalized (j-)Salem numbers: reciprocal algebraic integers with
      conjugates on the unit circle. Distinct from the units u != 1 of
      statements 6-9, which have no conjugate on the unit circle:
      |u(c_k)|^2 = 1/u(r_k), and u(r_k) = 1 would force u = 1.
    license: "unknown"
    author_endorsement: "n/a"

