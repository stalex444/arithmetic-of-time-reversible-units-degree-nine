alignment:
  namespace: "DegreeNine"
  statements:
    - source: "Elementary; adjacent to Reams 1999 and Lim 2020"
      lean: "DegreeNine.hadamardInv_posSemidef_iff"
      module: "Solution"
      status: "proved"
      note: "A PSD matrix with no zero entry has PSD Hadamard inverse iff it is w w*."
    - source: "Statement 1 with Paulsen 2002, Thm 3.7"
      lean: "DegreeNine.cp_both_iff_rankOne"
      module: "Solution"
      status: "proved"
      note: "Both Schur multipliers completely positive iff rank one."
    - source: "PALOMAR-2026-10-21-000012, statement (3), applied"
      lean: "DegreeNine.compositum_setting"
      module: "Solution"
      status: "proved"
      note: "L ⊔ M = K, linearly disjoint, signature (3, 3)."
    - source: "This work"
      lean: "DegreeNine.slot_assignment_exists_unique"
      module: "Solution"
      status: "proved"
      note: "The slot assignment exists, is a Hermitian bijection, and is unique."
    - source: "This work"
      lean: "DegreeNine.rankOne_iff_relNorm_eq_ratCast"
      module: "Solution"
      status: "proved"
      note: "Rank-one symbol of x != 0 iff equal positive rational relative norms."
    - source: "This work"
      lean: "DegreeNine.unit_rankOne_iff"
      module: "Solution"
      status: "proved"
      note: "Rank-one symbol of a unit iff trivial relative norms to L and M."
    - source: "This work"
      lean: "DegreeNine.relNormKernel_torsionFree_rank_two"
      module: "Solution"
      status: "proved"
      note: "The units of trivial relative norm form a torsion-free group of rank 2."
    - source: "This work"
      lean: "DegreeNine.reversible_iff"
      module: "Solution"
      status: "proved"
      note: "Both-way complete positivity iff trivial relative norms."
    - source: "This work"
      lean: "DegreeNine.exists_reversible"
      module: "Solution"
      status: "proved"
      note: "A unit of infinite order all of whose powers run both ways."
    - source: "This work, from Paulsen 2002 Thm 3.7 at the places of a (2, 1) field; ‖σ(u)‖ = 1 is the Salem case"
      lean: "DegreeNine.quartic_reversible_iff"
      module: "Solution"
      status: "proved"
      note: "Degree four: both ways iff positive at the real places and |sigma(u)| = 1."

