  - id: "Registered entry PALOMAR-2026-10-21-000012 (stalex444/pdt-hermite-signature-compositum, registered revision 5aa870e98236ba240561b798265c629df8c2d031)"
    relationship: "other"
    note: >-
      PROOF-MODULE REUSE, CITED. Its compared statement (3),
      places_compositum, and the supporting declarations listed in
      BUILD.txt (Module provenance; HermiteCompositum/Places.lean) are copied
      into ReversibleUnits/Compositum.lean with the namespace and the
      ambient field's name changed and every statement and proof otherwise
      unchanged; each carries a docstring citing that entry. Statement 3
      here applies places_compositum; it is not a re-comparison of it.
  - id: "https://github.com/leanprover-community/mathlib4 (Matrix.PosSemidef, Matrix.vecMulVec, Algebra.norm, IntermediateField.LinearDisjoint, NumberField.InfinitePlace, NumberField.ComplexEmbedding, NumberField.Units.torsion, NumberField.Units.logEmbedding)"
    relationship: "builds-on"
    note: >-
      The compared statements use Mathlib vocabulary plus four definitions
      in Challenge.lean (IsPositiveMap, schurAmp, IsCPSchur,
      IsSlotAssignment), repeated verbatim in Solution.lean.
      DefinitionAudit.lean kernel-checks the facts the statements rely on.
      Mathlib at the pin has no Schur-multiplier complete-positivity
      criterion, no Salem predicate and no relative-norm product formula
      for a compositum; the entry proves the latter from
      Algebra.norm_eq_prod_embeddings.

status:
  scope: >-
    Formalized: ten compared theorems, in comparator order, namespace
    DegreeNine (see the description for their content). Proved in the
    repository, not compared: the relative-norm product formula for a
    linearly disjoint compositum (ReversibleUnits.map_norm_left,
    map_norm_right), N_{K/L}(m) = N_{M/Q}(m) for m in M
    (norm_algebraMap_right), the symbol's multiplicativity under the
    Hadamard product (symbol_mul, symbol_inv), the explicit slot
    assignment (slotEquiv) and the rank of H in the form finrank Z
    (Additive H) = 2 (finrank_relNormKernel). Not formalized: the
    converse (whether every field of signature (3, 3) with a nontrivial
    rank-one unit is such a compositum); the shapes n >= 4 (degree n^2,
    signature (n, n(n-1)/2)); any concrete field.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

