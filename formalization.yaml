fidelity:
  divergences: >-
    (a) The hypotheses are inline: finrank Q L = 3, finrank Q M = 3,
    finrank Q K = 9, IsTotallyReal L and nrRealPlaces M = 1; that L and M
    are linearly disjoint and generate K is derived (statement 3), not
    assumed. (b) The slot assignment enters as a predicate
    (IsSlotAssignment) on a function Fin 3 x Fin 3 -> (K ->+* C), fixed by
    the restrictions of each slot to L and to M; statement 4 proves it
    exists, is a bijection, and is unique, so statements 5-9, which
    quantify over every function satisfying it, are about one determined
    array. (c) Rank one is spelled e (i, j) x = w i * conj (w j) in
    statements 5-6 and X = vecMulVec w (star w) in statements 1-2; the
    two are the same condition entrywise. (d) "Rank 2" in statement 7 is
    the Z-rank of the span of the logarithmic embedding's image of H,
    together with the absence of torsion in H; the library also proves
    finrank Z (Additive H) = 2. (e) Complete positivity is the ampliation
    form (every id_k ⊗ T_S positive), stated in full by IsCPSchur.
    Mathlib's CompletelyPositiveMap (C⋆-algebra maps, through CStarMatrix)
    is not used, because Matrix ι ι ℂ carries no C⋆-algebra order instance
    at the pin; IsCPSchur states the same condition concretely, as
    positivity of id_k ⊗ T_S on Matrix (Fin k × ι) (Fin k × ι) ℂ, the block
    form of a k × k matrix with entries in Matrix ι ι ℂ; DefinitionAudit
    proves it equivalent to S.PosSemidef. (f)
    Statement 10's symbol is written out as the 2 x 2 matrix of the two
    real conjugates and the complex one; the labelling of places is
    arbitrary (any equivalences e₁, e₂). (g) The physical reading in the
    README's application section is cited, not a theorem; no compared
    statement asserts it. (h) Satisfiability of the hypotheses is not
    kernel-checked; any totally real cubic L with M = Q(2^(1/3)) gives such
    a K (computed, not in the package).

